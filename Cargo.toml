[package]
name = "miccat"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lightweight Windows process audio router"
publish = false

[dependencies]
# Slint 1.18 与 windows-rs 0.62 对齐，避免 COM 接口类型跨版本。
slint = { version = "~1.18", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "image-default-formats",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi", "registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Media_MediaFoundation",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Networking_WinHttp",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[build-dependencies]
slint-build = "~1.18"

[profile.dev.package.i-slint-renderer-software]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
